<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DailyMark" />
    <!-- Figtree for UI; Fraunces for page titles (my notes, daily spark, …).
         Both are self-hosted (see the @font-face block in index.css): the
         Google Fonts stylesheet was render-blocking from a third origin, so
         first paint waited on two extra DNS + TLS handshakes before any text
         could appear. Preloading the latin subsets starts them with the HTML
         instead of after the CSS has been parsed. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/figtree-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/fraunces-latin.woff2"
      crossorigin
    />
    <title>DailyMark</title>
    <script>
      // Apply the stored theme + notes mood before first paint so there's no
      // flash of the wrong palette while React boots.
      (function () {
        var root = document.documentElement;
        var stored = localStorage.getItem("theme");
        var light =
          stored === "light" ||
          (stored !== "dark" &&
            window.matchMedia("(prefers-color-scheme: light)").matches);
        root.classList.toggle("light", light);
        root.classList.toggle("dark", !light);

        var mood = localStorage.getItem("notes-mood");
        if (mood !== "cobalt" && mood !== "midnight" && mood !== "harbor") {
          mood = "cobalt";
        }
        root.dataset.mood = mood;

        // The login hero is the LCP element, and it lives inside the lazily
        // loaded Login chunk — the browser could not discover it until
        // HTML → entry JS → route chunk had all resolved. Preload it here
        // instead, but only when there is no stored Supabase session: a
        // signed-in visitor lands on /notes and would never show the image.
        try {
          var signedIn = false;
          for (var i = 0; i < localStorage.length; i++) {
            if (/^sb-.*-auth-token$/.test(localStorage.key(i))) {
              signedIn = true;
              break;
            }
          }
          if (!signedIn) {
            var hero = document.createElement("link");
            hero.rel = "preload";
            hero.as = "image";
            hero.href = "/img/login-journal-1600.webp";
            hero.imageSrcset =
              "/img/login-journal-960.webp 960w, /img/login-journal-1600.webp 1600w";
            hero.imageSizes = "100vw";
            hero.fetchPriority = "high";
            document.head.appendChild(hero);
          }
        } catch (err) {
          // Private mode / storage disabled — skip the hint, not the app.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
