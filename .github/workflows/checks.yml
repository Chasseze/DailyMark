name: Quality and security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - run: supabase start -x studio,imgproxy,logflare,vector,supavisor
      - run: docker exec -i supabase_db_workspace psql -U postgres -d postgres < tests/security.sql
      - run: mkdir -p work && supabase status -o json > work/local-status.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
